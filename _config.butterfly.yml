# ============================================================
# Butterfly 5.7.0 主题配置
# 官方文档：https://butterfly.js.org/
# ============================================================

# --------------------------------------
# 导航设置
# --------------------------------------
nav:
  logo:
  display_title: true
  display_post_title: true
  # Whether to fix navigation bar
  fixed: false

menu:
  首页: / || fas fa-home
  Writeups: /ctf/ || fas fa-flag
  Knowledge: /knowledge/ || fas fa-book
  Resources: /resources/ || fas fa-compass
  Journey: /journey/ || fas fa-route
  Projects: /projects/ || fas fa-code-branch
  About: /about/ || fas fa-user

# --------------------------------------
# 代码块设置（5.7 官方键名：code_blocks）
# --------------------------------------
code_blocks:
  theme: darker
  macStyle: true
  height_limit: 400
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# --------------------------------------
# 图片设置
# --------------------------------------
favicon: /img/favicon.png

# 头像（5.7 官方结构：嵌套对象，非字符串）
avatar:
  img: /img/butterfly-icon.png
  effect: false

disable_top_img: false
default_top_img:
index_img:
archive_img:
tag_img:
tag_per_img:
category_img:
category_per_img:
footer_img: false
background:

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    # - /images/cover/default.png

error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

error_404:
  enable: false
  subtitle: 'Page Not Found'
  background: /img/error-page.png

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# --------------------------------------
# 首页设置
# --------------------------------------
# 5.7 官方：index_site_info_top 为空或百分比字符串，严禁填布尔值
index_site_info_top:
index_top_img_height:

subtitle:
  enable: true
  effect: true
  typed_option:
  source: false
  sub:
    - "Learning Web Security"
    - "CTF Player"
    - "Focus on PHP Audit"

index_layout: 3

index_post_content:
  method: 3
  length: 200

# --------------------------------------
# 文章设置
# --------------------------------------
toc:
  post: true
  page: false
  number: true
  expand: true
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

reward:
  enable: false
  text:
  QR_code:

post_edit:
  enable: false
  url:

related_post:
  enable: true
  limit: 6
  date_type: created

post_pagination: 1

noticeOutdate:
  enable: false
  style: flat
  limit_day: 365
  position: top
  message_prev: It has been
  message_next: days since the last update, the content of the article may be outdated.

# --------------------------------------
# 页脚设置
# --------------------------------------
footer:
  nav:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: true
  custom_text: 记录网络安全学习过程，保持好奇，持续生长

# --------------------------------------
# 侧边栏（5.7 官方：嵌套结构，非扁平布尔值）
# --------------------------------------
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 网络安全学习者 / CTF选手 / 记录成长过程
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/kings-well-byte
  card_announcement:
    enable: true
    content: 欢迎来到我的安全学习博客，记录从0到1的成长历程
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_newest_comments:
    enable: false
    sort_order:
    limit: 6
    storage: 10
    avatar: true
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 40
    color: false
    custom_colors:
    orderby: random
    order: 1
    sort_order:
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 3
    sort_order:
  card_post_series:
    enable: false
    series_title: false
    orderBy: 'date'
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:
    runtime_date:

# --------------------------------------
# 右下角按钮
# --------------------------------------
rightside_bottom:

translate:
  enable: false
  default: 繁
  defaultEncoding: 2
  translateDelay: 0
  msgToTraditionalChinese: '繁'
  msgToSimplifiedChinese: '簡'

readmode: true

darkmode:
  enable: true
  button: true
  autoChangeMode: 1
  start:
  end:

rightside_scroll_percent: false

rightside_item_order:
  enable: false
  hide:
  show:

rightside_config_animation: true

# --------------------------------------
# 全局设置
# --------------------------------------
anchor:
  auto_update: false
  click_to_scroll: false

photofigcaption: false

copy:
  enable: true
  copyright:
    enable: false
    limit_count: 150

# 字数统计（5.7 官方键名：wordcount）
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 访客统计（5.7 官方结构：site_uv / site_pv / page_pv）
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# --------------------------------------
# 数学公式（5.7 官方：math.use，非顶层 katex）
# --------------------------------------
math:
  use: katex
  per_page: true
  hide_scrollbar: false
  mathjax:
    enableMenu: true
    tags: none
  katex:
    copy_tex: false

# --------------------------------------
# 搜索（5.7 官方：search.use，非顶层 local_search）
# --------------------------------------
search:
  use: local_search
  placeholder:
  algolia_search:
    hitsPerPage: 6
  local_search:
    preload: true
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: false
      hitsPerPage: 8
    CDN:
  docsearch:
    appId:
    apiKey:
    indexName:
    option:

# --------------------------------------
# 分享（5.7 官方：share.use，非顶层 sharejs）
# --------------------------------------
share:
  use: sharejs
  sharejs:
    sites: facebook,x,wechat,weibo,qq
  addtoany:
    item: facebook,x,wechat,sina_weibo,facebook_messenger,email,copy_link

# --------------------------------------
# 主题色（Cyber 配色）
# --------------------------------------
theme_color:
  enable: true
  main: '#00FF9C'
  paginator: '#00FF9C'
  text_selection: '#00FF9C'
  link_color: '#00FF9C'
  hr_color: '#00FF9C'
  code_foreground: '#FF4D6D'
  code_background: '#161B22'
  toc_color: '#00FF9C'
  button_hover: '#00c57a'
  blockquote_padding_color: '#00FF9C'
  meta_color: '#8B949E'
  scrollbar_color: '#00FF9C'

# --------------------------------------
# 字体（Inter + JetBrains Mono）
# --------------------------------------
font:
  global_font_size:
  code_font_size:
  font_family: "Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
  code_font_family: "'JetBrains Mono', Consolas, Menlo, monospace"

# --------------------------------------
# 评论（Giscus 已配置）
# --------------------------------------
comments:
  use: Giscus
  text: true
  lazyload: false
  count: false
  card_post_count: false

giscus:
  repo: kings-well-byte/kings-well-byte.github.io
  repo_id: R_kgDOT4iVcg
  category_id: DIC_kwDOT4iVcs4DDYap
  light_theme: light
  dark_theme: dark
  js:
  option:

# --------------------------------------
# 聊天/分析/广告（留空，不启用）
# --------------------------------------
chat:
  use:
  rightside_button: false
  button_hide_show: false

baidu_analytics:
google_analytics:
cloudflare_analytics:
microsoft_clarity:
umami_analytics:
  enable: false
  serverURL:
  script_name: script.js
  website_id:
  option:
  UV_PV:
    site_uv: false
    site_pv: false
    page_pv: false
  token:

google_tag_manager:
  tag_id:
  domain:

google_adsense:
  enable: false
  auto_ads: true
  js: https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js
  client:
  enable_page_level_ads: true

ad:
  index:
  aside:
  post:

site_verification:

# --------------------------------------
# 美化/效果
# --------------------------------------
rounded_corners_ui: true
text_align_justify: false

mask:
  header: true
  footer: true

preloader:
  enable: false
  source: 1
  pace_css_url:

enter_transitions: true
display_mode: dark

beautify:
  enable: false
  field: post
  title_prefix_icon:
  title_prefix_icon_color:

blog_title_font:
  font_link:
  font_family:

hr_icon:
  enable: true
  icon:
  icon_top:

activate_power_mode:
  enable: false
  colorful: true
  shake: true
  mobile: false

canvas_ribbon:
  enable: false
  size: 150
  alpha: 0.6
  zIndex: -1
  click_to_change: false
  mobile: false

canvas_fluttering_ribbon:
  enable: false
  mobile: false

canvas_nest:
  enable: false
  color: '0,0,255'
  opacity: 0.7
  zIndex: -1
  count: 99
  mobile: false

fireworks:
  enable: false
  zIndex: 9999
  mobile: false

click_heart:
  enable: false
  mobile: false

clickShowText:
  enable: false
  text:
  fontSize: 15px
  random: false
  mobile: false

lightbox:

series:
  enable: false
  orderBy: 'title'
  order: 1
  number: true

abcjs:
  enable: false
  per_page: true

mermaid:
  enable: true
  code_write: false
  theme:
    light: default
    dark: dark
  open_in_new_tab: true
  zoom_pan: true

chartjs:
  enable: false
  fontColor:
    light: 'rgba(0, 0, 0, 0.8)'
    dark: 'rgba(255, 255, 255, 0.8)'
  borderColor:
    light: 'rgba(0, 0, 0, 0.1)'
    dark: 'rgba(255, 255, 255, 0.2)'
  scale_ticks_backdropColor:
    light: 'transparent'
    dark: 'transparent'

note:
  style: flat
  icons: true
  border_radius: 3
  light_bg_offset: 0

pjax:
  enable: false
  exclude:

snackbar:
  enable: false
  position: bottom-left
  bg_light: '#49b1f5'
  bg_dark: '#1f1f1f'

instantpage: false

lazyload:
  enable: false
  native: false
  field: site
  placeholder:
  blur: false

pwa:
  enable: false
  manifest:
  apple_touch_icon:
  favicon_32_32:
  favicon_16_16:
  mask_icon:

Open_Graph_meta:
  enable: true
  option:

structured_data:
  enable: false
  alternate_name:

css_prefix: true

